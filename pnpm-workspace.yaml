cleanupUnusedCatalogs: true
linkWorkspacePackages: true
preferWorkspacePackages: true
blockExoticSubdeps: true
trustPolicy: 'no-downgrade'
trustPolicyExclude:
  - 'chokidar@4.0.3' # Socket score 99; popular, healthy cadence.
  - 'express-rate-limit@8.3.0' # Socket score 100; popular, healthy cadence.
  - 'semver@5.7.2' # Socket score 100; popular npm-maintained legacy release.
  - 'semver@6.3.1' # Socket score 100; popular npm-maintained latest-6 release.
  - 'ua-parser-js@0.7.41' # Socket score 100; popular, healthy cadence.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # octane adapter upgrade: published less than 24 hours ago
  - octane@0.12.1
  - '@tanstack/octane-store@0.13.0'
  # Preact 11 peer support: published less than 24 hours ago
  - '@tanstack/preact-store@0.13.5'
  # devtools host peers: published less than 24 hours ago
  - '@tanstack/angular-devtools@0.0.13'
  - '@tanstack/devtools@0.16.0'
  - '@tanstack/devtools-ui@0.7.2'
  - '@tanstack/devtools-utils@0.7.2'
  - '@tanstack/preact-devtools@0.10.15'
  - '@tanstack/react-devtools@0.10.14'
  - '@tanstack/solid-devtools@0.8.14'
  - '@tanstack/svelte-devtools@0.1.8'
  - '@tanstack/vue-devtools@0.2.28'
packages:
  - 'e2e'
  - 'examples/**/*'
  - 'packages/*'
packageExtensions:
  # @analogjs/vite-plugin-nitro imports h3 v1 without declaring it, so it
  # resolves the hoisted h3 v2 and fails to load.
  '@analogjs/vite-plugin-nitro':
    dependencies:
      h3: ^1.15.11
onlyBuiltDependencies:
  - esbuild

allowBuilds:
  # root dependency
  nx: true
  unrs-resolver: false # not directly required for build
  esbuild: true

  # @angular/build
  '@parcel/watcher': false # optional dep of @angular/build
  lmdb: false # optional dep of @angular/build
  msgpackr-extract: false # optional dep of @angular/build

  # @tanstack/vue-store
  vue-demi: false # only required for vue 2 support

overrides:
  # Ember's transforms require Babel 7; these tools also allow Babel 8.
  '@nullvoxpopuli/ember-build-tooling-utils>@babel/core': '^7.29.7'
  '@nullvoxpopuli/ember-vite>@babel/core': '^7.29.7'
  '@tanstack/alpine-hotkeys': 'workspace:*'
  '@tanstack/angular-hotkeys': 'workspace:*'
  '@tanstack/angular-hotkeys-devtools': 'workspace:*'
  '@tanstack/ember-hotkeys': 'workspace:*'
  '@tanstack/hotkeys': 'workspace:*'
  '@tanstack/hotkeys-devtools': 'workspace:*'
  '@tanstack/lit-hotkeys': 'workspace:*'
  '@tanstack/lit-hotkeys-devtools': 'workspace:*'
  '@tanstack/octane-hotkeys': 'workspace:*'
  '@tanstack/preact-hotkeys': 'workspace:*'
  '@tanstack/preact-hotkeys-devtools': 'workspace:*'
  '@tanstack/react-hotkeys': 'workspace:*'
  '@tanstack/react-hotkeys-devtools': 'workspace:*'
  '@tanstack/solid-hotkeys': 'workspace:*'
  '@tanstack/solid-hotkeys-devtools': 'workspace:*'
  '@tanstack/svelte-hotkeys': 'workspace:*'
  '@tanstack/svelte-hotkeys-devtools': 'workspace:*'
  '@tanstack/vue-hotkeys': 'workspace:*'
  '@tanstack/vue-hotkeys-devtools': 'workspace:*'
