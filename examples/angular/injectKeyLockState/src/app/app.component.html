<div class="app">
  <h1>injectKeyLockState</h1>

  <div class="field">
    <label for="password">Password</label>
    <input id="password" type="password" />
    <p role="status" class="warning">
      {{ capsLock() === true ? 'Caps Lock is on' : '' }}
    </p>
  </div>

  <div class="locks">
    @for (lock of locks; track lock.name) {
      <div class="lock" [class.on]="lock.state() === true">
        <span class="lock-name">{{ lock.name }}</span>
        <span>{{ describe(lock.state()) }}</span>
      </div>
    }
  </div>

  <p class="note">
    Unknown until you press a key, click, or move the mouse. Num Lock and Scroll
    Lock stay unknown on macOS.
  </p>
</div>
