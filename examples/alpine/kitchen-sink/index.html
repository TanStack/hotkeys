<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TanStack Hotkeys | Alpine kitchen-sink</title>
  </head>
  <body>
    <div x-data="layout">
      <header>
        <h1>TanStack Hotkeys kitchen sink</h1>
        <p>
          Hold Alt / Option to see shortcut hints. Change routes to see
          registrations mount and unmount.
        </p>
        <nav aria-label="Examples">
          <template x-for="page in (pages)" :key="(page.to)"
            ><a
              :href="(page.to)"
              :class="(currentPath === page.to ? 'active' : '')"
              @click="(((e) =&gt; { e.preventDefault(); navigate({ to: page.to }); }))($event)"
              ><span x-text="[(page.label), &quot; &quot;].join('')"></span
              ><span
                style="display: contents"
                x-data="hint(() => ({hotkey: (page.shortcut)}))"
                ><template x-if="(visible &amp;&amp; (props().enabled ?? true))"
                  ><kbd
                    ><span
                      x-text="[(formatForDisplay(props().hotkey))].join('')"
                    ></span></kbd></template
                ><template
                  x-if="!((visible &amp;&amp; (props().enabled ?? true)))"
                  ><span></span></template></span></a
          ></template>
        </nav>
        <button
          @click="((() =&gt; showShortcuts = !showShortcuts))($event)"
          :aria-expanded="(showShortcuts)"
        >
          <span
            x-text="[&quot; &quot;, (showShortcuts ? 'Hide' : 'Show'), &quot; shortcuts&quot;, (' '), &quot; &quot;].join('')"
          ></span
          ><span
            style="display: contents"
            x-data='hint(() => ({hotkey: "Alt+Shift+[KeyK]"}))'
            ><template x-if="(visible &amp;&amp; (props().enabled ?? true))"
              ><kbd
                ><span
                  x-text="[(formatForDisplay(props().hotkey))].join('')"
                ></span></kbd></template
            ><template x-if="!((visible &amp;&amp; (props().enabled ?? true)))"
              ><span></span></template
          ></span>
        </button>
      </header>
      <template x-if="(showShortcuts)"
        ><section aria-label="Registered shortcuts">
          <h2>Registered shortcuts</h2>
          <p>
            Global and current-route registrations, including disabled handlers.
            Scoped shortcuts run inside their target.
          </p>
          <template x-for="group in (groups)" :key="(group)"
            ><div>
              <h3><span x-text="[(group)].join('')"></span></h3>
              <table>
                <thead>
                  <tr>
                    <th>Action</th>
                    <th>Binding</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody>
                  <template
                    x-for="reg in (registrations.filter((reg) =&gt; (reg.options.meta?.group ?? 'Other') === group))"
                    :key="(reg.id)"
                    ><tr>
                      <td>
                        <span
                          x-text='[" ", (reg.options.meta?.name ?? reg.id), " "].join(&apos;&apos;)'
                        ></span
                        ><br />
                        <small
                          ><span
                            x-text="[(reg.options.meta?.description)].join('')"
                          ></span
                        ></small>
                      </td>
                      <td>
                        <span
                          x-text="[&quot; &quot;, (('hotkey' in reg ? [reg.hotkey] : reg.sequence)
    .map((step) =&gt; formatForDisplay(step))
    .join(' → ')), &quot; &quot;].join('')"
                        ></span>
                      </td>
                      <td>
                        <span
                          x-text="[&quot; &quot;, (reg.options.enabled === false
    ? 'Disabled'
    : `${reg.triggerCount} fired`), &quot; &quot;].join('')"
                        ></span>
                      </td></tr
                  ></template>
                </tbody>
              </table></div
          ></template></section
      ></template>
      <main>
        <template x-if="(currentPath === '/editor')"
          ><span style="display: contents" x-data="editor(() => ({log: (log)}))"
            ><section>
              <h2>Editor scopes</h2>
              <p>
                Save is registered in both editors. Focus a textarea to choose
                which handler receives it.
              </p>
              <span
                style="display: contents"
                x-data='editorPane(() => ({name: "Draft", log: (props().log)}))'
                ><fieldset x-init="target.current = $el">
                  <legend>
                    <span
                      x-text='[" ", (props().name), " — ", (saves), " saves "].join(&apos;&apos;)'
                    ></span>
                  </legend>
                  <label>
                    Editor content
                    <textarea
                      :rows="(3)"
                      :value="(text)"
                      @input="(((e) =&gt; text = e.currentTarget.value))($event)"
                    ></textarea>
                  </label>
                  <p>
                    <kbd
                      ><span
                        x-text="[(formatForDisplay('Mod+[KeyS]'))].join('')"
                      ></span></kbd
                    ><span
                      x-text="[&quot; Save;&quot;, (' '), &quot; &quot;].join('')"
                    ></span
                    ><kbd
                      ><span
                        x-text="[(formatForDisplay('Alt+[Backspace]'))].join('')"
                      ></span
                    ></kbd>
                    Clear
                  </p>
                </fieldset></span
              >
              <span
                style="display: contents"
                x-data='editorPane(() => ({name: "Notes", log: (props().log)}))'
                ><fieldset x-init="target.current = $el">
                  <legend>
                    <span
                      x-text='[" ", (props().name), " — ", (saves), " saves "].join(&apos;&apos;)'
                    ></span>
                  </legend>
                  <label>
                    Editor content
                    <textarea
                      :rows="(3)"
                      :value="(text)"
                      @input="(((e) =&gt; text = e.currentTarget.value))($event)"
                    ></textarea>
                  </label>
                  <p>
                    <kbd
                      ><span
                        x-text="[(formatForDisplay('Mod+[KeyS]'))].join('')"
                      ></span></kbd
                    ><span
                      x-text="[&quot; Save;&quot;, (' '), &quot; &quot;].join('')"
                    ></span
                    ><kbd
                      ><span
                        x-text="[(formatForDisplay('Alt+[Backspace]'))].join('')"
                      ></span
                    ></kbd>
                    Clear
                  </p>
                </fieldset></span
              >
              <h3>Repeat and keyup</h3>
              <label>
                <input
                  type="checkbox"
                  :checked="(repeat)"
                  @input="(((e) =&gt; repeat = e.currentTarget.checked))($event)" /><span
                  x-text="[(' '), &quot; Allow key repeat &quot;].join('')"
                ></span
              ></label>
              <p>
                Hold
                <kbd
                  ><span
                    x-text="[(formatForDisplay('Alt+[ArrowRight]'))].join('')"
                  ></span></kbd
                ><span
                  x-text='[" to advance:", (&apos; &apos;), " ", (count), ". Release "].join(&apos;&apos;)'
                ></span
                ><kbd
                  ><span
                    x-text="[(formatForDisplay('Alt+[KeyU]'))].join('')"
                  ></span
                ></kbd>
                to log a keyup event.
              </p>
              <fieldset x-init="scope.current = $el" :tabindex="(0)">
                <legend>Propagation</legend>
                <label>
                  <input
                    type="checkbox"
                    :checked="(bubble)"
                    @input="(((e) =&gt; bubble = e.currentTarget.checked))($event)" /><span
                    x-text="[(' '), &quot; Allow bubbling and browser defaults &quot;].join('')"
                  ></span
                ></label>
                <p>
                  Focus this area and press
                  <kbd
                    ><span
                      x-text="[(formatForDisplay('Alt+[KeyB]'))].join('')"
                    ></span></kbd
                  >. Activity shows whether the document handler also receives
                  the event.
                </p>
                <button @click="((() =&gt; scope.current?.focus()))($event)">
                  Focus this area
                </button>
              </fieldset>
            </section></span
          ></template
        ><template x-if="!((currentPath === '/editor'))"
          ><span
            ><template x-if="(currentPath === '/sequences')"
              ><span
                style="display: contents"
                x-data="sequences(() => ({log: (log)}))"
                ><section>
                  <h2>Sequences</h2>
                  <p>
                    Try the physical G position twice, G then I, or hold Shift
                    and press R then T.
                  </p>
                  <label
                    ><span
                      x-text='[" Time between steps: ", (timeout), " ms", (&apos; &apos;), " "].join(&apos;&apos;)'
                    ></span
                    ><input
                      type="range"
                      min="300"
                      max="2500"
                      step="100"
                      :value="(timeout)"
                      @input="(((e) =&gt; timeout = Number(e.currentTarget.value)))($event)"
                    />
                  </label>
                  <table>
                    <thead>
                      <tr>
                        <th>Action</th>
                        <th>Sequence</th>
                        <th>Progress</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="reg in (sequences)" :key="(reg.id)"
                        ><tr>
                          <td>
                            <span
                              x-text="[(reg.options.meta?.name)].join('')"
                            ></span>
                          </td>
                          <td>
                            <span
                              x-text="[&quot; &quot;, (reg.sequence.map((step) =&gt; formatForDisplay(step)).join(' → ')), &quot; &quot;].join('')"
                            ></span>
                          </td>
                          <td>
                            <span
                              x-text='[" ", (reg.matchedStepCount), "/", (reg.sequence.length), " steps;", (&apos; &apos;), " ", (reg.triggerCount), " fired "].join(&apos;&apos;)'
                            ></span>
                          </td></tr
                      ></template>
                    </tbody>
                  </table>
                  <p>
                    Wrong keys and timeouts reset progress. Modifier-only
                    presses and automatic repeats do not advance a sequence.
                  </p>
                </section></span
              ></template
            ><template x-if="!((currentPath === '/sequences'))"
              ><span
                ><template x-if="(currentPath === '/recording')"
                  ><span
                    style="display: contents"
                    x-data="recording(() => ({log: (log)}))"
                    ><section>
                      <h2>Recording</h2>
                      <p>
                        Recorded bindings go directly into registrations.
                        Changes live in this page's Alpine state.
                      </p>
                      <label
                        ><span
                          x-text="[&quot; Record by&quot;, (' '), &quot; &quot;].join('')"
                        ></span
                        ><select
                          :value="(mode)"
                          :disabled="(recorder.isRecording || sequenceRecorder.isRecording)"
                          @input="(((e) =&gt; mode = e.currentTarget.value))($event)"
                        >
                          <option value="code">Physical code (default)</option>
                          <option value="key">Logical character</option>
                        </select>
                      </label>
                      <h3>Single shortcut</h3>
                      <p>
                        <kbd
                          ><span
                            x-text="[(formatForDisplay(hotkey))].join('')"
                          ></span
                        ></kbd>
                        — stored as
                        <code><span x-text="[(hotkey)].join('')"></span></code>
                      </p>
                      <button
                        :disabled="(recorder.isRecording || sequenceRecorder.isRecording)"
                        @click="((() =&gt; {
    problem = '';
    recorder.startRecording();
}))($event)"
                      >
                        <span
                          x-text="[&quot; &quot;, (recorder.isRecording ? 'Listening…' : 'Record shortcut'), &quot; &quot;].join('')"
                        ></span>
                      </button>
                      <button
                        @click="((() =&gt; {
    recorder.stopRecording();
    hotkey = initial;
    problem = '';
}))($event)"
                      >
                        Reset
                      </button>
                      <template x-if="(recorder.isRecording)"
                        ><button @click="(recorder.cancelRecording)($event)">
                          Cancel
                        </button></template
                      >
                      <p>
                        Include a modifier. Try Alt + 1 for a navigation
                        conflict. Escape cancels; Backspace restores the initial
                        shortcut.
                      </p>
                      <p role="status">
                        <span x-text="[(problem)].join('')"></span>
                      </p>
                      <h3>Sequence</h3>
                      <p>
                        <span
                          x-text="[&quot; &quot;, ((sequenceRecorder.isRecording ? sequenceRecorder.steps : sequence)
    .map((step) =&gt; formatForDisplay(step))
    .join(' → ') || 'Waiting for the first chord…'), &quot; &quot;].join('')"
                        ></span>
                      </p>
                      <label>
                        <input
                          type="checkbox"
                          :checked="(idle)"
                          @input="(((e) =&gt; idle = e.currentTarget.checked))($event)" /><span
                          x-text="[(' '), &quot; Commit after 1.5 seconds idle &quot;].join('')"
                        ></span
                      ></label>
                      <label>
                        <input
                          type="checkbox"
                          :checked="(commitOnEnter)"
                          @input="(((e) =&gt; commitOnEnter = e.currentTarget.checked))($event)" /><span
                          x-text="[(' '), &quot; Enter commits the sequence &quot;].join('')"
                        ></span
                      ></label>
                      <p>
                        <button
                          :disabled="(recorder.isRecording || sequenceRecorder.isRecording)"
                          @click="((() =&gt; {
    sequenceProblem = '';
    sequenceRecorder.startRecording();
}))($event)"
                        >
                          Record sequence
                        </button>
                        <button
                          :disabled="(!sequenceRecorder.isRecording || !sequenceRecorder.steps.length)"
                          @click="(sequenceRecorder.commitRecording)($event)"
                        >
                          Commit
                        </button>
                        <template x-if="(sequenceRecorder.isRecording)"
                          ><button
                            @click="(sequenceRecorder.cancelRecording)($event)"
                          >
                            Cancel
                          </button></template
                        >
                      </p>
                      <p>
                        Record at least two chords. Backspace removes a step;
                        when empty it restores the initial sequence. Rejected
                        steps remain editable.
                      </p>
                      <p role="status">
                        <span x-text="[(sequenceProblem)].join('')"></span>
                      </p></section></span></template
                ><template x-if="!((currentPath === '/recording'))"
                  ><span
                    ><template x-if="(currentPath === '/formatting')"
                      ><span
                        style="display: contents"
                        x-data="formatting(() => ({}))"
                        ><section>
                          <h2>Formatting</h2>
                          <label
                            ><span
                              x-text="[&quot; Platform&quot;, (' '), &quot; &quot;].join('')"
                            ></span
                            ><select
                              :value="(platform)"
                              @input="(((e) =&gt; platform = e.currentTarget.value))($event)"
                            >
                              <option value="mac">macOS</option>
                              <option value="windows">Windows</option>
                              <option value="linux">Linux</option>
                            </select>
                          </label>
                          <label>
                            <input
                              type="checkbox"
                              :checked="(modifierSymbols)"
                              @input="(((e) =&gt; modifierSymbols = e.currentTarget.checked))($event)" /><span
                              x-text="[(' '), &quot; Modifier symbols &quot;].join('')"
                            ></span
                          ></label>
                          <label>
                            <input
                              type="checkbox"
                              :checked="(keySymbols)"
                              @input="(((e) =&gt; keySymbols = e.currentTarget.checked))($event)" /><span
                              x-text="[(' '), &quot; Key symbols &quot;].join('')"
                            ></span
                          ></label>
                          <table>
                            <thead>
                              <tr>
                                <th>Stored binding</th>
                                <th>String</th>
                                <th>Parts</th>
                              </tr>
                            </thead>
                            <tbody>
                              <template
                                x-for="hotkey in [
    'Mod+Shift+ArrowUp',
    'Control++',
    'Alt+[KeyS]',
    'Mod+[NumpadAdd]',
]"
                                :key="(hotkey)"
                                ><tr>
                                  <td>
                                    <code
                                      ><span x-text="[(hotkey)].join('')"></span
                                    ></code>
                                  </td>
                                  <td>
                                    <span
                                      x-text="[(formatForDisplay(hotkey, options))].join('')"
                                    ></span>
                                  </td>
                                  <td>
                                    <template
                                      x-for="(part, i) in (formatForDisplay(hotkey, { ...options, parts: true }))"
                                      :key="(i)"
                                      ><kbd
                                        ><span
                                          x-text="[(part)].join('')"
                                        ></span></kbd
                                    ></template>
                                  </td></tr
                              ></template>
                            </tbody>
                          </table>
                          <p>
                            <span
                              x-text="[&quot; Physical codes use readable fallback labels. Supply a resolved&quot;, (' '), &quot; &quot;].join('')"
                            ></span
                            ><code>layoutMap</code> or explicit
                            <code>keyLabels</code> for layout-specific labels.
                          </p>
                        </section></span
                      ></template
                    ><template x-if="!((currentPath === '/formatting'))"
                      ><span
                        style="display: contents"
                        x-data="tickets(() => ({log: (log)}))"
                        ><section>
                          <h2>Tickets</h2>
                          <p>
                            <span
                              x-text='[" Created: ", (count), ". Hold Alt / Option for hints. Release and press again to create another ticket. "].join(&apos;&apos;)'
                            ></span>
                          </p>
                          <label>
                            <input
                              type="checkbox"
                              :checked="(enabled)"
                              @input="(((e) =&gt; enabled = e.currentTarget.checked))($event)" /><span
                              x-text="[(' '), &quot; Enable ticket actions &quot;].join('')"
                            ></span
                          ></label>
                          <p>
                            <button
                              :disabled="(!enabled)"
                              @click="(create)($event)"
                            >
                              Create ticket
                              <span
                                style="display: contents"
                                x-data='hint(() => ({hotkey: "Alt+[KeyC]", enabled: (enabled)}))'
                                ><template
                                  x-if="(visible &amp;&amp; (props().enabled ?? true))"
                                  ><kbd
                                    ><span
                                      x-text="[(formatForDisplay(props().hotkey))].join('')"
                                    ></span></kbd></template
                                ><template
                                  x-if="!((visible &amp;&amp; (props().enabled ?? true)))"
                                  ><span></span></template
                              ></span>
                            </button>
                            <button
                              :disabled="(!enabled)"
                              @click="(save)($event)"
                            >
                              Save pending
                              <span
                                style="display: contents"
                                x-data='hint(() => ({hotkey: "Alt+[KeyS]", enabled: (enabled)}))'
                                ><template
                                  x-if="(visible &amp;&amp; (props().enabled ?? true))"
                                  ><kbd
                                    ><span
                                      x-text="[(formatForDisplay(props().hotkey))].join('')"
                                    ></span></kbd></template
                                ><template
                                  x-if="!((visible &amp;&amp; (props().enabled ?? true)))"
                                  ><span></span></template
                              ></span>
                            </button>
                          </p>
                          <label
                            ><span
                              x-text="[&quot; Ticket note&quot;, (' '), &quot; &quot;].join('')"
                            ></span
                            ><input
                              placeholder="Try Alt + the physical C key while typing"
                            />
                          </label>
                          <p>
                            Create uses <code>ignoreInputs: false</code>; Save
                            uses the default input filtering. This example
                            supplies <code>requireReset: true</code>.
                          </p>
                        </section></span
                      ></template
                    ></span
                  ></template
                ></span
              ></template
            ></span
          ></template
        >
      </main>
      <section>
        <h2>Key state</h2>
        <p>
          <span
            x-text="[&quot; Keys: &quot;, (keys.join(' + ') || 'None'), &quot; &quot;].join('')"
          ></span
          ><br /><span
            x-text="[&quot; Codes: &quot;, (Object.values(codes).join(' + ') || 'None'), &quot; &quot;].join('')"
          ></span
          ><br /><span
            x-text="[&quot; Shift: &quot;, (shift ? 'held' : 'released'), &quot; &quot;].join('')"
          ></span>
        </p>
        <h2>Activity</h2>
        <button @click="((() =&gt; activity = []))($event)">Clear log</button>
        <ul aria-live="polite">
          <template x-for="(message, i) in (activity)" :key="(i)"
            ><li><span x-text="[(message)].join('')"></span></li
          ></template>
        </ul>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
