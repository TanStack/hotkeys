<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TanStack Hotkeys | Alpine kitchen-sink</title>
  </head>
  <body>
    <div x-data="layout">
      <header>
        <h1>TanStack Hotkeys kitchen sink</h1>
        <p>
          Hold Alt / Option to see shortcut hints. Change routes to see
          registrations mount and unmount.
        </p>
        <nav aria-label="Examples">
          <template x-for="page in (pages)" :key="page.to">
            <a
              :href="page.to"
              :class="currentPath === page.to ? 'active' : ''"
              @click.prevent="navigate({ to: page.to })"
            >
              <span x-text="`${page.label} `"></span>
              <span
                style="display: contents"
                x-data="hint(() => ({ hotkey: page.shortcut }))"
              >
                <template
                  x-if="visible.value &amp;&amp; (props().enabled ?? true)"
                >
                  <kbd x-text="formatForDisplay(props().hotkey)"></kbd>
                </template>
                <template
                  x-if="!(visible.value &amp;&amp; (props().enabled ?? true))"
                >
                  <span></span>
                </template>
              </span>
            </a>
          </template>
        </nav>
        <button
          @click="showShortcuts = !showShortcuts"
          :aria-expanded="showShortcuts"
        >
          <span
            x-text="` ${showShortcuts ? 'Hide' : 'Show'} shortcuts  `"
          ></span>
          <span
            style="display: contents"
            x-data='hint(() => ({ hotkey: "Alt+Shift+[KeyK]" }))'
          >
            <template x-if="visible.value &amp;&amp; (props().enabled ?? true)">
              <kbd x-text="formatForDisplay(props().hotkey)"></kbd>
            </template>
            <template
              x-if="!(visible.value &amp;&amp; (props().enabled ?? true))"
            >
              <span></span>
            </template>
          </span>
        </button>
      </header>
      <template x-if="showShortcuts">
        <section aria-label="Registered shortcuts">
          <h2>Registered shortcuts</h2>
          <p>
            Global and current-route registrations, including disabled handlers.
            Scoped shortcuts run inside their target.
          </p>
          <template x-for="group in (groups)" :key="group">
            <div>
              <h3 x-text="group"></h3>
              <table>
                <thead>
                  <tr>
                    <th>Action</th>
                    <th>Binding</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody>
                  <template
                    x-for="reg in (registrations.filter((reg) => (reg.options.meta?.group ?? 'Other') === group))"
                    :key="reg.id"
                  >
                    <tr>
                      <td>
                        <span
                          x-text="` ${reg.options.meta?.name ?? reg.id} `"
                        ></span>
                        <br />
                        <small x-text="reg.options.meta?.description"></small>
                      </td>
                      <td
                        x-text="` ${('hotkey' in reg ? [reg.hotkey] : reg.sequence).map(step => formatForDisplay(step)).join(' → ')} `"
                      ></td>
                      <td
                        x-text="` ${reg.options.enabled === false ? 'Disabled' : `${reg.triggerCount} fired`} `"
                      ></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>
        </section>
      </template>
      <main>
        <template x-if="currentPath === '/editor'">
          <span style="display: contents" x-data="editor(() => ({ log: log }))">
            <section>
              <h2>Editor scopes</h2>
              <p>
                Save is registered in both editors. Focus a textarea to choose
                which handler receives it.
              </p>
              <span
                style="display: contents"
                x-data='editorPane(() => ({ name: "Draft", log: props().log }))'
              >
                <fieldset x-init="target = $el">
                  <legend
                    x-text="` ${props().name} — ${saves} saves `"
                  ></legend>
                  <label>
                    Editor content
                    <textarea :rows="3" x-model="text"></textarea>
                  </label>
                  <p>
                    <kbd x-text="formatForDisplay('Mod+[KeyS]')"></kbd>
                    <span x-text="` Save;  `"></span>
                    <kbd x-text="formatForDisplay('Alt+[Backspace]')"></kbd>
                    Clear
                  </p>
                </fieldset>
              </span>
              <span
                style="display: contents"
                x-data='editorPane(() => ({ name: "Notes", log: props().log }))'
              >
                <fieldset x-init="target = $el">
                  <legend
                    x-text="` ${props().name} — ${saves} saves `"
                  ></legend>
                  <label>
                    Editor content
                    <textarea :rows="3" x-model="text"></textarea>
                  </label>
                  <p>
                    <kbd x-text="formatForDisplay('Mod+[KeyS]')"></kbd>
                    <span x-text="` Save;  `"></span>
                    <kbd x-text="formatForDisplay('Alt+[Backspace]')"></kbd>
                    Clear
                  </p>
                </fieldset>
              </span>
              <h3>Repeat and keyup</h3>
              <label>
                <input type="checkbox" x-model="repeat" />
                <span x-text="`  Allow key repeat `"></span>
              </label>
              <p>
                Hold
                <kbd x-text="formatForDisplay('Alt+[ArrowRight]')"></kbd>
                <span x-text="` to advance:  ${count}. Release `"></span>
                <kbd x-text="formatForDisplay('Alt+[KeyU]')"></kbd>
                to log a keyup event.
              </p>
              <fieldset x-init="scope = $el" :tabindex="0">
                <legend>Propagation</legend>
                <label>
                  <input type="checkbox" x-model="bubble" />
                  <span
                    x-text="`  Allow bubbling and browser defaults `"
                  ></span>
                </label>
                <p>
                  Focus this area and press
                  <kbd x-text="formatForDisplay('Alt+[KeyB]')"></kbd>
                  . Activity shows whether the document handler also receives
                  the event.
                </p>
                <button @click="scope?.focus()">Focus this area</button>
              </fieldset>
            </section>
          </span>
        </template>
        <template x-if="!(currentPath === '/editor')">
          <span>
            <template x-if="currentPath === '/sequences'">
              <span
                style="display: contents"
                x-data="sequences(() => ({ log: log }))"
              >
                <section>
                  <h2>Sequences</h2>
                  <p>
                    Try the physical G position twice, G then I, or hold Shift
                    and press R then T.
                  </p>
                  <label>
                    <span
                      x-text="` Time between steps: ${timeout} ms  `"
                    ></span>
                    <input
                      type="range"
                      min="300"
                      max="2500"
                      step="100"
                      :value="timeout"
                      @input="timeout = Number($event.currentTarget.value)"
                    />
                  </label>
                  <table>
                    <thead>
                      <tr>
                        <th>Action</th>
                        <th>Sequence</th>
                        <th>Progress</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="reg in (sequences)" :key="reg.id">
                        <tr>
                          <td x-text="reg.options.meta?.name"></td>
                          <td
                            x-text="` ${reg.sequence.map(step => formatForDisplay(step)).join(' → ')} `"
                          ></td>
                          <td
                            x-text="` ${reg.matchedStepCount}/${reg.sequence.length} steps;  ${reg.triggerCount} fired `"
                          ></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                  <p>
                    Wrong keys.value and timeouts reset progress. Modifier-only
                    presses and automatic repeats do not advance a sequence.
                  </p>
                </section>
              </span>
            </template>
            <template x-if="!(currentPath === '/sequences')">
              <span>
                <template x-if="currentPath === '/recording'">
                  <span
                    style="display: contents"
                    x-data="recording(() => ({ log: log }))"
                  >
                    <section>
                      <h2>Recording</h2>
                      <p>
                        Recorded bindings go directly into registrations.
                        Changes live in this page's Alpine state.
                      </p>
                      <label>
                        <span x-text="` Record by  `"></span>
                        <select
                          :value="mode"
                          :disabled="recorder.isRecording || sequenceRecorder.isRecording"
                          @input="mode = $event.currentTarget.value"
                        >
                          <option value="code">Physical code (default)</option>
                          <option value="key">Logical character</option>
                        </select>
                      </label>
                      <h3>Single shortcut</h3>
                      <p>
                        <kbd x-text="formatForDisplay(hotkey)"></kbd>
                        — stored as
                        <code x-text="hotkey"></code>
                      </p>
                      <button
                        :disabled="recorder.isRecording || sequenceRecorder.isRecording"
                        @click="startRecording()"
                        x-text="` ${recorder.isRecording ? 'Listening…' : 'Record shortcut'} `"
                      ></button>
                      <button @click="resetShortcut()">Reset</button>
                      <template x-if="recorder.isRecording">
                        <button @click="recorder.cancelRecording($event)">
                          Cancel
                        </button>
                      </template>
                      <p>
                        Include a modifier. Try Alt + 1 for a navigation
                        conflict. Escape cancels; Backspace restores the initial
                        shortcut.
                      </p>
                      <p role="status" x-text="problem"></p>
                      <h3>Sequence</h3>
                      <p
                        x-text="` ${(sequenceRecorder.isRecording ? sequenceRecorder.steps : sequence).map(step => formatForDisplay(step)).join(' → ') || 'Waiting for the first chord…'} `"
                      ></p>
                      <label>
                        <input type="checkbox" x-model="idle" />
                        <span
                          x-text="`  Commit after 1.5 seconds idle `"
                        ></span>
                      </label>
                      <label>
                        <input type="checkbox" x-model="commitOnEnter" />
                        <span x-text="`  Enter commits the sequence `"></span>
                      </label>
                      <p>
                        <button
                          :disabled="recorder.isRecording || sequenceRecorder.isRecording"
                          @click="startSequenceRecording()"
                        >
                          Record sequence
                        </button>
                        <button
                          :disabled="!sequenceRecorder.isRecording || !sequenceRecorder.steps.length"
                          @click="sequenceRecorder.commitRecording($event)"
                        >
                          Commit
                        </button>
                        <template x-if="sequenceRecorder.isRecording">
                          <button
                            @click="sequenceRecorder.cancelRecording($event)"
                          >
                            Cancel
                          </button>
                        </template>
                      </p>
                      <p>
                        Record at least two chords. Backspace removes a step;
                        when empty it restores the initial sequence. Rejected
                        steps remain editable.
                      </p>
                      <p role="status" x-text="sequenceProblem"></p>
                    </section>
                  </span>
                </template>
                <template x-if="!(currentPath === '/recording')">
                  <span>
                    <template x-if="currentPath === '/formatting'">
                      <span
                        style="display: contents"
                        x-data="formatting(() => ({}))"
                      >
                        <section>
                          <h2>Formatting</h2>
                          <label>
                            <span x-text="` Platform  `"></span>
                            <select x-model="platform">
                              <option value="mac">macOS</option>
                              <option value="windows">Windows</option>
                              <option value="linux">Linux</option>
                            </select>
                          </label>
                          <label>
                            <input type="checkbox" x-model="modifierSymbols" />
                            <span x-text="`  Modifier symbols `"></span>
                          </label>
                          <label>
                            <input type="checkbox" x-model="keySymbols" />
                            <span x-text="`  Key symbols `"></span>
                          </label>
                          <table>
                            <thead>
                              <tr>
                                <th>Stored binding</th>
                                <th>String</th>
                                <th>Parts</th>
                              </tr>
                            </thead>
                            <tbody>
                              <template
                                x-for="hotkey in [
    'Mod+Shift+ArrowUp',
    'Control++',
    'Alt+[KeyS]',
    'Mod+[NumpadAdd]',
]"
                                :key="hotkey"
                              >
                                <tr>
                                  <td>
                                    <code x-text="hotkey"></code>
                                  </td>
                                  <td
                                    x-text="formatForDisplay(hotkey, options)"
                                  ></td>
                                  <td>
                                    <template
                                      x-for="(part, i) in (formatForDisplay(hotkey, { ...options, parts: true }))"
                                      :key="i"
                                    >
                                      <kbd x-text="part"></kbd>
                                    </template>
                                  </td>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                          <p>
                            <span
                              x-text="` Physical codes.value use readable fallback labels. Supply a resolved  `"
                            ></span>
                            <code>layoutMap</code>
                            or explicit
                            <code>keyLabels</code>
                            for layout-specific labels.
                          </p>
                        </section>
                      </span>
                    </template>
                    <template x-if="!(currentPath === '/formatting')">
                      <span
                        style="display: contents"
                        x-data="tickets(() => ({ log: log }))"
                      >
                        <section>
                          <h2>Tickets</h2>
                          <p
                            x-text="` Created: ${count}. Hold Alt / Option for hints. Release and press again to create another ticket. `"
                          ></p>
                          <label>
                            <input type="checkbox" x-model="enabled" />
                            <span x-text="`  Enable ticket actions `"></span>
                          </label>
                          <p>
                            <button :disabled="!enabled" @click="create()">
                              Create ticket
                              <span
                                style="display: contents"
                                x-data='hint(() => ({ hotkey: "Alt+[KeyC]", enabled: enabled }))'
                              >
                                <template
                                  x-if="visible.value &amp;&amp; (props().enabled ?? true)"
                                >
                                  <kbd
                                    x-text="formatForDisplay(props().hotkey)"
                                  ></kbd>
                                </template>
                                <template
                                  x-if="!(visible.value &amp;&amp; (props().enabled ?? true))"
                                >
                                  <span></span>
                                </template>
                              </span>
                            </button>
                            <button :disabled="!enabled" @click="save()">
                              Save pending
                              <span
                                style="display: contents"
                                x-data='hint(() => ({ hotkey: "Alt+[KeyS]", enabled: enabled }))'
                              >
                                <template
                                  x-if="visible.value &amp;&amp; (props().enabled ?? true)"
                                >
                                  <kbd
                                    x-text="formatForDisplay(props().hotkey)"
                                  ></kbd>
                                </template>
                                <template
                                  x-if="!(visible.value &amp;&amp; (props().enabled ?? true))"
                                >
                                  <span></span>
                                </template>
                              </span>
                            </button>
                          </p>
                          <label>
                            <span x-text="` Ticket note  `"></span>
                            <input
                              placeholder="Try Alt + the physical C key while typing"
                            />
                          </label>
                          <p>
                            Create uses
                            <code>ignoreInputs: false</code>
                            ; Save uses the default input filtering. This
                            example supplies
                            <code>requireReset: true</code>
                            .
                          </p>
                        </section>
                      </span>
                    </template>
                  </span>
                </template>
              </span>
            </template>
          </span>
        </template>
      </main>
      <section>
        <h2>Key state</h2>
        <p>
          <span x-text="` Keys: ${keys.value.join(' + ') || 'None'} `"></span>
          <br />
          <span
            x-text="` Codes: ${Object.values(codes.value).join(' + ') || 'None'} `"
          ></span>
          <br />
          <span x-text="` Shift: ${shift.value ? 'held' : 'released'} `"></span>
        </p>
        <h2>Activity</h2>
        <button @click="activity = []">Clear log</button>
        <ul aria-live="polite">
          <template x-for="(message, i) in (activity)" :key="i">
            <li x-text="message"></li>
          </template>
        </ul>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
