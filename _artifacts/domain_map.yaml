# domain_map.yaml
# Library: @tanstack/hotkeys
# Version: 0.16.0
# Date: 2026-10-18
# Status: draft

library:
  name: '@tanstack/hotkeys'
  version: 0.16.0
  repository: https://github.com/TanStack/hotkeys
  description: Type-safe keyboard shortcuts with a framework-agnostic core and adapters for ten frameworks.
  primary_framework: framework-agnostic
domains:
  - name: Hotkeys
    slug: hotkeys
    description: Registering, matching, scoping, and labeling keyboard shortcuts, and the keyboard behavior the library already owns.
  - name: App hotkeys
    slug: app-hotkeys
    description: One catalog of every shortcut for cheat sheets, command palettes, rebinding, conflict checks, and saved custom hotkeys.
  - name: Framework bindings
    slug: framework-bindings
    description: Each adapter's registration API, reactivity rules, provider or manager scopes, and element targets.
skills:
  - name: hotkeys-core
    slug: hotkeys-core
    domain: hotkeys
    description: A developer adds, fixes, or reviews keyboard shortcuts and needs the hotkey format, the defaults the library owns, and how hotkeys turn on and off, instead of reading KeyboardEvent by hand.
    packages:
      - '@tanstack/hotkeys'
    tasks:
      - Add a save shortcut that works on macOS, Windows, and Linux
      - Replace hand-written keydown listeners with registered hotkeys
      - Make Escape close only the topmost dialog
      - Add Vim-style key sequences
      - Show a shortcut's label in a button, menu, or tooltip
      - Bind game controls to key positions instead of characters
      - Register hotkeys from code outside components
      - Test hotkeys in unit tests
    covers:
      - Workarounds mapped to adapter APIs (listeners, platform checks, registries, enabled flags, cheat sheet lists, held-key state, recorders)
      - enabled versus component lifetime versus scopes versus target
      - 'Non-obvious behavior: disabled hotkeys and preventDefault, exact modifiers, repeats and requireReset, physical bindings'
      - matchesKeyboardEvent for key handlers the app does not own
      - 'Sequences: first-key chords and progress (matchedStepCount)'
      - 'Testing: platform, singleton resets, event dispatch'
    type: core
    reference_candidates:
      - topic: scopes
        reason: Precedence, exclusive, allow, stacking, and manager activation are needed only for grouped hotkeys
      - topic: testing
        reason: Event dispatch, platform, and singleton resets apply only when writing tests
    failure_modes:
      - mistake: Reading key events instead of registering hotkeys
        mechanism: A keydown listener with metaKey || ctrlKey saves on Control+S on macOS, misses Caps Lock and non-Latin layouts, and ignores scopes, recorders, and devtools.
        wrong_pattern: document.addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key === 's') save() })
        correct_pattern: getHotkeyManager().register('Mod+S', () => save())
        source: docs/guides/sensible-defaults.md
        priority: HIGH
        status: active
        skills:
          - hotkeys-core
          - react-hotkeys
          - preact-hotkeys
          - solid-hotkeys
          - vue-hotkeys
          - svelte-hotkeys
          - angular-hotkeys
          - lit-hotkeys
          - alpine-hotkeys
          - ember-hotkeys
          - octane-hotkeys
      - mistake: Wrapping the library in a shortcut facade
        mechanism: 'A useShortcut(keys: string) wrapper or shortcut registry casts strings to hotkeys, losing type checks, sequences, options, app hotkeys, and devtools listing.'
        wrong_pattern: 'export function useShortcut(keys: string, fn: () => void) { useHotkey(keys as HotkeyChord, fn) }'
        correct_pattern: "useHotkey('Mod+S', save, { meta: { name: 'Save' } }) // or defineAppHotkeys for a catalog"
        source: 'Maintainer report (2026-10-18): agents generate custom facades and wrappers around the library'
        priority: HIGH
        status: active
        skills:
          - hotkeys-core
          - app-hotkeys
          - react-hotkeys
          - preact-hotkeys
          - solid-hotkeys
          - vue-hotkeys
          - svelte-hotkeys
          - angular-hotkeys
          - lit-hotkeys
          - alpine-hotkeys
          - ember-hotkeys
          - octane-hotkeys
      - mistake: Disabling a hotkey to skip its action
        mechanism: A disabled hotkey ignores the key completely, so the browser Save Page dialog opens.
        wrong_pattern: "register('Mod+S', save, { enabled: isDirty })"
        correct_pattern: register('Mod+S', () => { if (!isDirty) return; save() })
        source: docs/framework/react/guides/hotkeys.md#enable-and-disable-hotkeys
        priority: HIGH
        status: active
      - mistake: Tracking the topmost dialog with enabled
        mechanism: Per-hotkey enabled flags race with mount order and every component must know about every dialog; exclusive scopes suspend everything behind the topmost dialog.
        wrong_pattern: "useHotkey('Escape', close, { enabled: useIsTopMostModal(id) })"
        correct_pattern: <HotkeysProvider scope={`dialog-${useId()}`} exclusive><DialogBody /></HotkeysProvider>
        source: https://github.com/TanStack/hotkeys/issues/42
        priority: HIGH
        status: fixed-but-legacy-risk
        version_context: 'Scopes shipped in PR #189; older code fakes modal stacks with enabled.'
        skills:
          - hotkeys-core
          - react-hotkeys
          - preact-hotkeys
          - solid-hotkeys
          - vue-hotkeys
          - svelte-hotkeys
          - angular-hotkeys
          - lit-hotkeys
          - alpine-hotkeys
          - ember-hotkeys
          - octane-hotkeys
      - mistake: Reusing one exclusive scope name for several open dialogs
        mechanism: Two activations of the same exclusive scope log a warning and both dialogs handle the same keys.
        wrong_pattern: <HotkeysProvider scope="dialog" exclusive> in a shared Dialog component
        correct_pattern: A per-instance scope name such as `dialog-${useId()}`
        source: src/hotkey-manager.ts (activateScope warning)
        priority: HIGH
        status: active
        skills:
          - hotkeys-core
          - react-hotkeys
          - preact-hotkeys
          - solid-hotkeys
          - vue-hotkeys
          - svelte-hotkeys
          - angular-hotkeys
          - lit-hotkeys
          - alpine-hotkeys
          - ember-hotkeys
          - octane-hotkeys
      - mistake: Toggling without requireReset
        mechanism: Chords fire on each automatic repeat, so holding the keys flickers a toggle.
        wrong_pattern: register('Mod+B', toggleSidebar)
        correct_pattern: "register('Mod+B', toggleSidebar, { requireReset: true })"
        source: docs/guides/sensible-defaults.md#chords-fire-on-keydown-and-repeat-while-held
        priority: MEDIUM
        status: active
      - mistake: Using letters for position-based controls
        mechanism: Logical W follows the character, so WASD stops forming a cluster on AZERTY.
        wrong_pattern: register('W', moveUp)
        correct_pattern: register('[KeyW]', moveUp)
        source: docs/guides/sensible-defaults.md#match-a-keys-position-instead
        priority: MEDIUM
        status: active
      - mistake: Expecting a hotkey to match extra modifiers
        mechanism: Modifiers match exactly, so ArrowDown never fires with Shift held and a shiftKey branch is dead code.
        wrong_pattern: "register('ArrowDown', (e) => e.shiftKey ? extend() : move())"
        correct_pattern: register('ArrowDown', move); register('Shift+ArrowDown', extend)
        source: docs/guides/sensible-defaults.md#modifiers-must-match-exactly; probe on 2026-10-18
        priority: MEDIUM
        status: active
      - mistake: Targeting an element that cannot take focus
        mechanism: Element targets receive keys only while they or a descendant has focus.
        wrong_pattern: "register('Escape', close, { target: divWithoutTabIndex })"
        correct_pattern: Give the element tabindex="0"
        source: docs/guides/sensible-defaults.md#listeners-attach-to-the-document
        priority: MEDIUM
        status: active
      - mistake: Installing a second copy of @tanstack/hotkeys
        mechanism: A separate core install at another version has its own manager, so scopes activated through one copy do not apply to hotkeys registered through the other.
        wrong_pattern: import { getHotkeyManager } from '@tanstack/hotkeys' // separately installed at another version
        correct_pattern: import { getHotkeyManager } from '@tanstack/react-hotkeys'
        source: src/_manager-ref.ts, src/hotkey-manager.ts
        priority: MEDIUM
        status: active
      - mistake: Testing without a fixed platform
        mechanism: Test DOMs report no real platform (happy-dom on macOS detects windows), so Mod resolves differently between machines.
        wrong_pattern: "register('Mod+S', save); dispatch({ key: 's', metaKey: true })"
        correct_pattern: "register('Mod+S', save, { platform: 'mac' })"
        source: src/platform.ts; probe on 2026-10-18
        priority: MEDIUM
        status: active
  - name: app-hotkeys
    slug: app-hotkeys
    domain: app-hotkeys
    description: A developer needs one list of every shortcut for a cheat sheet or command palette, or lets users rebind and save shortcuts.
    packages:
      - '@tanstack/hotkeys'
    tasks:
      - List every shortcut in a cheat sheet, including shortcuts on routes that have not rendered
      - Build a command palette whose commands may have no shortcut
      - Let users rebind, unbind, and reset shortcuts
      - Record a new shortcut and reject conflicts
      - Save custom shortcuts and restore them on load
    covers:
      - defineAppHotkeys declarations, ids, null defaults, declared options and scope, Register augmentation
      - Provider appHotkeys, customHotkeys, onCustomHotkeysChange; provideAppHotkeys for Lit, Alpine, Ember
      - App hotkey list statuses and isCustom
      - setCustomHotkey, findConflicts, resetCustomHotkey, resetCustomHotkeys
      - HotkeyRecorder options, validation, rejection reasons, physical recordings
    type: core
    reference_candidates:
      - topic: recording
        reason: Recorder behavior and validation apply only to settings screens
    failure_modes:
      - mistake: Keeping a parallel shortcut registry
        mechanism: A hand-written shortcut map is not type-checked as hotkeys and has no custom hotkeys, conflict checks, statuses, or devtools entry.
        wrong_pattern: "export const SHORTCUTS = { save: { keys: 'Mod+S', label: 'Save' } }"
        correct_pattern: "export const appHotkeys = defineAppHotkeys({ 'doc.save': { hotkey: 'Mod+S', meta: { name: 'Save' } } })"
        source: docs/framework/react/guides/app-hotkeys.md
        priority: HIGH
        status: active
      - mistake: Registering the app hotkey value instead of the app hotkey
        mechanism: The declared default ignores the user custom hotkey, and the registration loses its id, meta, scope, and options, so the list reports it as inactive.
        wrong_pattern: useHotkey(appHotkeys['doc.save'].hotkey as HotkeyChord, save)
        correct_pattern: useHotkey(appHotkeys['doc.save'], save)
        source: src/adapter.ts (prepareHotkeyDefinitions); tests/skills/shortcut-settings
        priority: HIGH
        status: active
        skills:
          - app-hotkeys
          - react-hotkeys
          - preact-hotkeys
          - solid-hotkeys
          - vue-hotkeys
          - svelte-hotkeys
          - angular-hotkeys
          - lit-hotkeys
          - alpine-hotkeys
          - ember-hotkeys
          - octane-hotkeys
      - mistake: Loading custom hotkeys after the provider is created
        mechanism: Providers and provideAppHotkeys read customHotkeys once, so a later value is ignored and shortcuts revert to defaults.
        wrong_pattern: <HotkeysProvider customHotkeys={query.data} ...> before the query resolves
        correct_pattern: Render the provider after the data loads, or key it by user
        source: src/app-hotkeys.ts (AppHotkeysStore); every adapter provider creates the store once
        priority: HIGH
        status: active
        skills:
          - app-hotkeys
          - react-hotkeys
          - preact-hotkeys
          - solid-hotkeys
          - vue-hotkeys
          - svelte-hotkeys
          - angular-hotkeys
          - lit-hotkeys
          - alpine-hotkeys
          - ember-hotkeys
          - octane-hotkeys
      - mistake: Ignoring the conflicts setCustomHotkey returns
        mechanism: A conflicting rebinding changes nothing, so reporting success misleads the user.
        wrong_pattern: setCustomHotkey(id, hotkey); toast('Saved')
        correct_pattern: const conflicts = setCustomHotkey(id, hotkey); if (conflicts.length) showError(...)
        source: src/app-hotkeys.ts
        priority: HIGH
        status: active
      - mistake: Saving the effective list instead of customHotkeys
        mechanism: Saving every effective hotkey freezes the current defaults into user data.
        wrong_pattern: localStorage.setItem(key, JSON.stringify(Object.fromEntries(list.map(...))))
        correct_pattern: onCustomHotkeysChange={(custom) => localStorage.setItem(key, JSON.stringify(custom))}
        source: docs/framework/react/guides/app-hotkeys.md#customize-and-persist-hotkeys; tests/skills/shortcut-settings
        priority: MEDIUM
        status: active
      - mistake: Sharing keys between app hotkeys without declared scopes
        mechanism: App hotkeys with no scope conflict with every app hotkey on the same keys, so rebindings are rejected.
        wrong_pattern: "'doc.save': { hotkey: 'Mod+S' }, 'comment.post': { hotkey: 'Mod+S' }"
        correct_pattern: "Declare scope: 'document' and scope: 'comments'"
        source: src/app-hotkeys.ts (scopesOverlap)
        priority: MEDIUM
        status: active
      - mistake: Building a recorder from keydown events
        mechanism: A hand-written recorder records Meta instead of Mod, records the typed character, and lets registered hotkeys fire while recording.
        wrong_pattern: window.addEventListener('keydown', (e) => setRecorded(buildString(e)))
        correct_pattern: useHotkeyRecorder({ onRecord })
        source: docs/framework/react/guides/custom-hotkey-recording.md
        priority: HIGH
        status: active
      - mistake: Rewriting recorded physical bindings
        mechanism: Replacing [KeyS] with S changes a position binding into a character binding.
        wrong_pattern: "onRecord: (h) => save(String(h).replace(/\\[Key(\\w)\\]/, '$1'))"
        correct_pattern: 'onRecord: (h) => setCustomHotkey(id, h)'
        source: docs/guides/sensible-defaults.md#recording-captures-what-the-user-pressed
        priority: MEDIUM
        status: active
  - name: react-hotkeys
    slug: react-hotkeys
    domain: framework-bindings
    description: A developer registers, scopes, and displays hotkeys in a React app with the adapter's own APIs and reactivity rules.
    packages:
      - '@tanstack/react-hotkeys'
    tasks:
      - Register hotkeys in React components
      - Keep hotkey options in sync with React state
      - Limit a hotkey to one element
      - Give a dialog an exclusive hotkey scope in React
      - Use app hotkeys, recorders, and held-key state in React
    covers:
      - React registration API, reactive options, element targets, provider or manager scopes, app hotkey wiring
    type: framework
    reference_candidates:
      - topic: app hotkeys in React
        reason: Provider, registration, cheat sheet, and settings wiring are needed only for catalogs and rebinding
    failure_modes:
      - mistake: Passing ref.current as target
        mechanism: ref.current is null during the first render and a null target means document, so the hotkey listens page-wide until a later render.
        wrong_pattern: "useHotkey('Delete', remove, { target: listRef.current })"
        correct_pattern: "useHotkey('Delete', remove, { target: listRef })"
        source: src/utils.ts (resolveTarget); tests/skills/editor-shortcuts
        priority: HIGH
        status: active
      - mistake: Registering above its own provider
        mechanism: A hook reads the provider above its component, so a dialog that renders its own exclusive provider registers Escape in the suspended outer scope.
        wrong_pattern: function Dialog() { useHotkey('Escape', close); return <HotkeysProvider scope="d" exclusive>...</HotkeysProvider> }
        correct_pattern: Register in a child component of the provider
        source: docs/framework/react/quick-start.md; tests/skills/editor-shortcuts
        priority: HIGH
        status: active
