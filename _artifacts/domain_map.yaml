    type: framework
    reference_candidates:
      - topic: app hotkeys in Octane
        reason: Provider, registration, cheat sheet, and settings wiring are needed only for catalogs and rebinding
    failure_modes:
      - mistake: Passing a ref object as target
        mechanism: Octane targets must be elements; keep the element in state with a callback ref.
        wrong_pattern: "useHotkey('Escape', close, { target: panelRef })"
        correct_pattern: 'const [panel, setPanel] = useState(null); ref={setPanel}; { target: panel }'
        source: src/useHotkey.ts
        priority: HIGH
        status: active
      - mistake: Calling hooks in loops or conditions
        mechanism: The compiler tracks hooks by call site.
        wrong_pattern: items.map((item) => useHotkey(item.hotkey, item.run))
        correct_pattern: useHotkeys(items.map(...))
        source: docs/framework/octane/quick-start.md
        priority: MEDIUM
        status: active
tensions:
  - name: Component lifetime versus one catalog
    skills:
      - hotkeys-core
      - app-hotkeys
    description: Hotkeys belong in the components that own their actions, while cheat sheets and settings need every shortcut up front.
    implication: Agents either move callbacks into a central registry or build cheat sheets from live registrations; declarations hold no callbacks, and components still register them.
  - name: Logical declarations versus physical recordings
    skills:
      - app-hotkeys
    description: Declarations are usually logical (Mod+P) while the recorder records positions (Mod+[KeyP]), and conflict checks compare them as different hotkeys.
    implication: A rebinding to Command+P passes conflict checks and then runs two actions.
