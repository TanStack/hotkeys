gaps:
  - skill: app-hotkeys
    question: Should app hotkey conflict checks and findHotkeyConflicts treat a physical binding such as Mod+[KeyP] as overlapping a logical Mod+P?
    context: With default recorder settings, a user can rebind Save to Command+P over Print without a conflict, and both run. The skill states the current behavior.
    status: open
  - skill: lit-hotkeys
    question: Should the Lit guides state that @hotkey needs experimentalDecorators, or should the decorator support standard decorators?
    context: The examples set experimentalDecorators; the docs do not mention it, and standard decorators fail with TS1241.
    status: open
  - skill: octane-hotkeys
    question: docs/installation.md says Octane 0.1.36 within 0.1, but the package peer range is octane >=0.12.0. Which is current?
    context: The peer range is current. docs/installation.md now says Octane 0.12 or newer, matching the skill.
    status: resolved
