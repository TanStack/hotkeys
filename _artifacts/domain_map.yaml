        mechanism: 'Same as React: a null target on the first render means document.'
        wrong_pattern: "useHotkey('Delete', remove, { target: listRef.current })"
        correct_pattern: "useHotkey('Delete', remove, { target: listRef })"
        source: src/utils.ts
        priority: HIGH
        status: active
      - mistake: Registering above its own provider
        mechanism: The hook reads the provider above its component.
        wrong_pattern: Dialog registers Escape and renders its own exclusive provider
        correct_pattern: Register in a child component
        source: docs/framework/preact/quick-start.md
        priority: HIGH
