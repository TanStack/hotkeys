  - name: solid-hotkeys
    slug: solid-hotkeys
    domain: framework-bindings
    description: A developer registers, scopes, and displays hotkeys in a Solid app with the adapter's own APIs and reactivity rules.
    packages:
      - '@tanstack/solid-hotkeys'
    tasks:
      - Register hotkeys in Solid components
      - Keep hotkey options in sync with Solid state
      - Limit a hotkey to one element
      - Give a dialog an exclusive hotkey scope in Solid
      - Use app hotkeys, recorders, and held-key state in Solid
    covers:
      - Solid registration API, reactive options, element targets, provider or manager scopes, app hotkey wiring
    type: framework
    reference_candidates:
      - topic: app hotkeys in Solid
        reason: Provider, registration, cheat sheet, and settings wiring are needed only for catalogs and rebinding
    failure_modes:
      - mistake: Passing a plain options object that reads signals
        mechanism: A plain object is read once during setup, so enabled never follows the signal.
        wrong_pattern: "createHotkey('Mod+S', save, { enabled: isDirty() })"
        correct_pattern: "createHotkey('Mod+S', save, () => ({ enabled: isDirty() }))"
        source: src/createHotkey.ts
        priority: HIGH
        status: active
      - mistake: Passing an unassigned element variable as target
        mechanism: An undefined target means document.
        wrong_pattern: "let el; createHotkey('Delete', remove, { target: el })"
        correct_pattern: "const [el, setEl] = createSignal(null); createHotkey('Delete', remove, () => ({ target: el() }))"
        source: packages/hotkeys/src/adapter.ts
        priority: HIGH
        status: active
  - name: vue-hotkeys
    slug: vue-hotkeys
    domain: framework-bindings
    description: A developer registers, scopes, and displays hotkeys in a Vue app with the adapter's own APIs and reactivity rules.
    packages:
      - '@tanstack/vue-hotkeys'
    tasks:
      - Register hotkeys in Vue components
      - Keep hotkey options in sync with Vue state
      - Limit a hotkey to one element
      - Give a dialog an exclusive hotkey scope in Vue
      - Use app hotkeys, recorders, and held-key state in Vue
    covers:
      - Vue registration API, reactive options, element targets, provider or manager scopes, app hotkey wiring
    type: framework
    reference_candidates:
      - topic: app hotkeys in Vue
        reason: Provider, registration, cheat sheet, and settings wiring are needed only for catalogs and rebinding
    failure_modes:
      - mistake: Passing ref.value instead of the ref
        mechanism: '.value reads once in setup: enabled stays fixed and a null target never registers.'
        wrong_pattern: "useHotkey('Mod+S', save, { enabled: isDirty.value, target: panel.value })"
        correct_pattern: "useHotkey('Mod+S', save, { enabled: isDirty, target: panel })"
        source: src/useHotkeys.ts
        priority: HIGH
        status: active
      - mistake: Using nested recorder refs in templates
        mechanism: Templates unwrap only top-level refs, so v-if="recorder.isRecording" is always truthy.
        wrong_pattern: const recorder = useHotkeyRecorder(...); v-if="recorder.isRecording"
        correct_pattern: const { isRecording } = useHotkeyRecorder(...)
        source: src/useHotkeyRecorder.ts
        priority: MEDIUM
        status: active
      - mistake: Registering in the component that provides the scope
        mechanism: A provider in a component template or provideHotkeysContext in its setup applies to children only.
        wrong_pattern: 'provideHotkeysContext({ scope, exclusive: true }); useHotkey(...) in the same setup'
        correct_pattern: Register in a child component
        source: docs/framework/vue/guides/hotkeys-provider-and-scopes.md
        priority: HIGH
        status: active
  - name: svelte-hotkeys
    slug: svelte-hotkeys
    domain: framework-bindings
    description: A developer registers, scopes, and displays hotkeys in a Svelte app with the adapter's own APIs and reactivity rules.
    packages:
      - '@tanstack/svelte-hotkeys'
    tasks:
      - Register hotkeys in Svelte components
      - Keep hotkey options in sync with Svelte state
      - Limit a hotkey to one element
      - Give a dialog an exclusive hotkey scope in Svelte
      - Use app hotkeys, recorders, and held-key state in Svelte
    covers:
      - Svelte registration API, reactive options, element targets, provider or manager scopes, app hotkey wiring
    type: framework
    reference_candidates:
      - topic: app hotkeys in Svelte
        reason: Provider, registration, cheat sheet, and settings wiring are needed only for catalogs and rebinding
    failure_modes:
      - mistake: Passing a plain options object that reads state
        mechanism: A plain object is read once during initialization.
        wrong_pattern: "createHotkey('Mod+S', save, { enabled: isDirty })"
        correct_pattern: "createHotkey('Mod+S', save, () => ({ enabled: isDirty }))"
        source: src/createHotkeys.svelte.ts
        priority: HIGH
        status: active
      - mistake: Destructuring reactive getters
        mechanism: Destructuring copies the current value, so the UI never updates.
        wrong_pattern: const { held } = getIsKeyHeld('Shift')
        correct_pattern: const shift = getIsKeyHeld('Shift'); shift.held
        source: src/getIsKeyHeld.svelte.ts
        priority: HIGH
        status: active
      - mistake: Creating hotkeys before setHotkeysContext
        mechanism: Hotkeys created first read the outer context and land in a suspended scope.
        wrong_pattern: "createHotkey('Escape', close); setHotkeysContext({ scope, exclusive: true })"
        correct_pattern: Call setHotkeysContext first
        source: src/HotkeysCtx.ts
        priority: HIGH
        status: active
  - name: angular-hotkeys
    slug: angular-hotkeys
    domain: framework-bindings
    description: A developer registers, scopes, and displays hotkeys in a Angular app with the adapter's own APIs and reactivity rules.
    packages:
      - '@tanstack/angular-hotkeys'
    tasks:
      - Register hotkeys in Angular components
      - Keep hotkey options in sync with Angular state
      - Limit a hotkey to one element
      - Give a dialog an exclusive hotkey scope in Angular
      - Use app hotkeys, recorders, and held-key state in Angular
    covers:
      - Angular registration API, reactive options, element targets, provider or manager scopes, app hotkey wiring
    type: framework
    reference_candidates:
      - topic: app hotkeys in Angular
        reason: Provider, registration, cheat sheet, and settings wiring are needed only for catalogs and rebinding
    failure_modes:
      - mistake: Using @HostListener for shortcuts
        mechanism: The listener ignores scopes, recorders, and devtools, and its modifier checks are wrong.
        wrong_pattern: "@HostListener('document:keydown', ['$event'])"
        correct_pattern: injectHotkey('Mod+S', () => this.save())
        source: docs/framework/angular/quick-start.md
        priority: HIGH
        status: active
      - mistake: Passing a plain options object that reads signals
        mechanism: The object is read once in the constructor; a viewChild target is undefined there and means document.
        wrong_pattern: "injectHotkey('Mod+S', save, { enabled: this.isDirty() })"
        correct_pattern: "injectHotkey('Mod+S', save, () => ({ enabled: this.isDirty() }))"
        source: src/injectHotkey.ts
        priority: HIGH
        status: active
      - mistake: Sharing one exclusive scope across dialog instances
        mechanism: Component providers with a fixed scope give every instance the same exclusive scope.
        wrong_pattern: "providers: [provideHotkeys({ scope: 'dialog', exclusive: true })]"
        correct_pattern: 'Derive the scope from a per-instance token: scope: () => inject(DIALOG_SCOPE)'
        source: src/hotkeys-provider.ts
        priority: HIGH
        status: active
      - mistake: Injecting hotkeys outside an injection context
        mechanism: inject() throws in ngOnInit and event handlers.
        wrong_pattern: ngOnInit() { injectHotkey('Mod+S', save) }
        correct_pattern: injectHotkeys(() => this.items().map(...)) in the constructor
        source: src/injectHotkeys.ts
        priority: MEDIUM
        status: active
  - name: lit-hotkeys
    slug: lit-hotkeys
    domain: framework-bindings
    description: A developer registers, scopes, and displays hotkeys in a Lit app with the adapter's own APIs and reactivity rules.
    packages:
      - '@tanstack/lit-hotkeys'
    tasks:
      - Register hotkeys in Lit components
      - Keep hotkey options in sync with Lit state
      - Limit a hotkey to one element
      - Give a dialog an exclusive hotkey scope in Lit
      - Use app hotkeys, recorders, and held-key state in Lit
    covers:
      - Lit registration API, reactive options, element targets, provider or manager scopes, app hotkey wiring
    type: framework
    reference_candidates:
      - topic: app hotkeys in Lit
        reason: Provider, registration, cheat sheet, and settings wiring are needed only for catalogs and rebinding
    failure_modes:
      - mistake: Forgetting to release a manager scope activation
        mechanism: An exclusive activation that is never released keeps every other hotkey suspended.
        wrong_pattern: "connectedCallback() { getHotkeyManager().activateScope('dialog', { exclusive: true }) }"
        correct_pattern: this.release = manager.activateScope(...); disconnectedCallback() { this.release() }
        source: docs/framework/react/guides/hotkey-manager.md#activate-a-scope
        priority: HIGH
        status: active
        skills:
          - lit-hotkeys
          - alpine-hotkeys
          - ember-hotkeys
      - mistake: Not adding HotkeyController to the host
        mechanism: HotkeyController does not add itself, so it never registers.
        wrong_pattern: private save = new HotkeyController(this, 'Mod+S', fn)
        correct_pattern: this.addController(new HotkeyController(this, 'Mod+S', fn))
        source: src/controllers/hotkey.ts
        priority: HIGH
        status: active
      - mistake: Using @hotkey with standard decorators
        mechanism: The decorator has the legacy signature and fails with TS1241 without experimentalDecorators.
        wrong_pattern: '@hotkey("Mod+S") in a standard-decorator project'
        correct_pattern: Enable experimentalDecorators or use HotkeyController
        source: src/decorators/hotkey.ts; tsc probe on 2026-10-18
        priority: MEDIUM
        status: active
      - mistake: Reading instance state in decorator options
        mechanism: Decorator arguments are evaluated once, when the class is defined.
        wrong_pattern: "@hotkey('Mod+S', { enabled: this.dirty })"
        correct_pattern: HotkeyController with an options function
        source: src/decorators/hotkey.ts
        priority: MEDIUM
        status: active
  - name: alpine-hotkeys
    slug: alpine-hotkeys
    domain: framework-bindings
    description: A developer registers, scopes, and displays hotkeys in a Alpine app with the adapter's own APIs and reactivity rules.
    packages:
      - '@tanstack/alpine-hotkeys'
    tasks:
      - Register hotkeys in Alpine components
