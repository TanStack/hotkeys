    type: framework
    reference_candidates:
      - topic: app hotkeys in Ember
        reason: Provider, registration, cheat sheet, and settings wiring are needed only for catalogs and rebinding
    failure_modes:
      - mistake: Passing an unbound method as the callback
        mechanism: The helper calls the callback without the component as this, so it throws on key press.
        wrong_pattern: save() { this.doc.save() } with {{useHotkey "Mod+S" this.save}}
        correct_pattern: save = () => this.doc.save()
        source: docs/framework/ember/quick-start.md; src/useHotkey.ts
        priority: HIGH
        status: active
      - mistake: Writing a sequence as a string in a template
        mechanism: '"G G" registers a single key named G G.'
        wrong_pattern: '{{useHotkey "G G" this.top}}'
        correct_pattern: '{{useHotkey (array "G" "G") this.top}}'
        source: docs/framework/ember/quick-start.md
        priority: MEDIUM
        status: active
      - mistake: Treating createHotkeysScope as a hotkey scope
        mechanism: It only sets helper defaults.
        wrong_pattern: createHotkeysScope() for a modal
        correct_pattern: activateScope plus registerDestructor
        source: docs/framework/ember/quick-start.md
        priority: HIGH
        status: active
