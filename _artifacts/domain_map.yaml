      - Alpine registration API, reactive options, element targets, provider or manager scopes, app hotkey wiring
    type: framework
    reference_candidates:
      - topic: app hotkeys in Alpine
        reason: Provider, registration, cheat sheet, and settings wiring are needed only for catalogs and rebinding
    failure_modes:
      - mistake: Not destroying the owner
        mechanism: Owners are not tied to the Alpine lifecycle, so hotkeys outlive removed components.
        wrong_pattern: Alpine.data with createHotkeysScope() and no destroy()
        correct_pattern: destroy() { this.hotkeys.destroy() }
        source: src/scope.ts
        priority: HIGH
        status: active
      - mistake: Treating createHotkeysScope as a hotkey scope
        mechanism: It only owns registrations; dialogs still need getHotkeyManager().activateScope.
        wrong_pattern: createHotkeysScope() for a modal
        correct_pattern: 'activateScope(scope, { exclusive: true }) plus scope on each hotkey'
        source: docs/framework/alpine/quick-start.md
        priority: HIGH
        status: active
      - mistake: Passing a plain options object that reads state
        mechanism: A plain object is read once.
        wrong_pattern: "createHotkey('Mod+S', save, { enabled: this.dirty })"
        correct_pattern: "createHotkey('Mod+S', save, () => ({ enabled: this.dirty }))"
        source: src/createHotkeys.ts
        priority: HIGH
        status: active
