library:
  name: '@tanstack/hotkeys'
  version: 0.16.0
  repository: https://github.com/TanStack/hotkeys
  description: Type-safe keyboard shortcuts with a framework-agnostic core and
    adapters for React, Preact, Solid, Vue, Svelte, Angular, Lit, Alpine, Ember,
    and Octane.
generated_from:
  domain_map: _artifacts/domain_map.yaml
  skill_spec: _artifacts/skill_spec.md
distribution:
  mode: none
skills:
  - name: hotkeys-core
    slug: hotkeys-core
    domain: hotkeys
    package: packages/hotkeys
    path: skills/hotkeys-core/SKILL.md
    description: "Use when adding, fixing, or reviewing keyboard shortcuts with
      TanStack Hotkeys: replacing keydown listeners or another shortcut library,
      deciding when a hotkey works (enabled, scopes, targets), dialogs that own
      the keyboard, sequences, or testing hotkeys. Load the framework adapter's
      skill with it."
    sources:
      - src/hotkey-manager.ts
      - src/match.ts
      - TanStack/hotkeys:docs/guides/sensible-defaults.md
      - TanStack/hotkeys:docs/framework/react/guides/hotkeys.md
      - TanStack/hotkeys:docs/framework/react/guides/sequences.md
      - TanStack/hotkeys:docs/framework/react/guides/hotkeys-provider-and-scopes.md
      - TanStack/hotkeys:packages/react-hotkeys/tests/skills/editor-shortcuts/**
    references:
      - references/scopes.md
      - references/testing.md
    purpose: "Framework-neutral rules for TanStack Hotkeys: the work the library
      already does, how hotkeys turn on and off, and the pitfalls that don't
      surface as errors."
    requires: []
  - name: app-hotkeys
    slug: app-hotkeys
    domain: app-hotkeys
    package: packages/hotkeys
    path: skills/app-hotkeys/SKILL.md
    description: Use when an app built with TanStack Hotkeys needs a keyboard
      shortcut cheat sheet or help dialog, a command palette whose commands may
      have shortcuts, a settings screen where users rebind, unbind, or reset
      shortcuts, recording the shortcut a user presses, conflict checks between
      shortcuts, or saving custom shortcuts to storage.
    sources:
      - src/app-hotkeys.ts
      - src/hotkey-recorder.ts
      - src/conflicts.ts
      - TanStack/hotkeys:docs/framework/react/guides/app-hotkeys.md
      - TanStack/hotkeys:docs/framework/react/guides/cheat-sheet-ui-helpers.md
      - TanStack/hotkeys:docs/framework/react/guides/custom-hotkey-recording.md
      - TanStack/hotkeys:packages/react-hotkeys/tests/skills/shortcut-settings/**
    requires:
      - hotkeys-core
    references:
      - references/recording.md
    purpose: Declare every shortcut once with defineAppHotkeys, then build cheat
      sheets, rebinding, conflict checks, and persistence from those
      declarations instead of a parallel shortcut registry.
