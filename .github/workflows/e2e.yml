name: E2E

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browsers:
    name: Browsers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup Tools
        uses: TanStack/config/.github/setup@466151b2d479656b38942cd84a0a3dce29d48de3
      - name: Install Browsers
        run: pnpm --filter @tanstack/hotkeys-e2e exec playwright install --with-deps chromium firefox webkit
      - name: Run Browser Tests
        run: pnpm test:e2e

  keyboard-layouts:
    name: Keyboard Layouts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup Tools
        uses: TanStack/config/.github/setup@466151b2d479656b38942cd84a0a3dce29d48de3
      - name: Install X11 Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xdotool x11-xkb-utils xkb-data
          sudo cp e2e/docker/tanstack.xkb /usr/share/X11/xkb/symbols/tanstack
      - name: Install Browsers
        run: pnpm --filter @tanstack/hotkeys-e2e exec playwright install --with-deps chromium firefox
      - name: Run Keyboard Layout Tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" pnpm test:e2e:layouts
